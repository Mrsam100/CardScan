<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CardScan - Premium Protocol</title>
    <meta name="description" content="The high-fidelity monochromatic app for digital networking." />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
      
      :root {
        --color-bg: #F5F4F0;
        --color-surface: #FFFFFF;
        --color-text-main: #0a0a0a;
        --color-text-muted: #525252;
        --radius-lg: 24px;
        --radius-md: 16px;
        --radius-btn: 9999px;
      }

      html {
        scroll-behavior: smooth;
        background-color: var(--color-bg);
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: var(--color-text-main);
        background-color: var(--color-bg);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-size: 16px;
      }

      /* Premium Card Style - "Clay" feel */
      .clay-card {
        background: var(--color-surface);
        border: 1px solid rgba(255,255,255,0.6);
        border-radius: var(--radius-lg);
        box-shadow: 
          0 10px 20px -5px rgba(0, 0, 0, 0.05), 
          0 0 0 1px rgba(0,0,0,0.02);
        color: var(--color-text-main);
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      @media (min-width: 1024px) {
        .clay-card:hover {
          transform: translateY(-4px);
          box-shadow: 
            0 20px 40px -5px rgba(0, 0, 0, 0.08), 
            0 0 0 1px rgba(0,0,0,0.03);
        }
      }

      /* 3D Active Tab Effect */
      .btn-3d-active {
        color: white !important;
        transform: translateY(-2px);
        box-shadow: 
            0 4px 0px rgba(0,0,0,0.2), /* The "depth" */
            0 8px 15px rgba(0,0,0,0.2); /* The shadow */
        border: none;
        font-weight: 800;
        text-shadow: 0 1px 2px rgba(0,0,0,0.1);
      }

      .btn-3d-active:active {
        transform: translateY(0px);
        box-shadow: 
            0 0px 0px rgba(0,0,0,0.2), 
            0 4px 5px rgba(0,0,0,0.1);
      }

      /* Simple Inactive Tab */
      .btn-simple {
        background: transparent;
        color: var(--color-text-muted);
        font-weight: 600;
        border: 1px solid transparent;
        transition: all 0.2s ease;
      }
      
      .btn-simple:hover {
        background: rgba(0,0,0,0.04);
        color: var(--color-text-main);
      }

      /* 3D Icon Container */
      .icon-3d {
        background: linear-gradient(145deg, #ffffff, #f0f0f0);
        box-shadow: 
          6px 6px 12px #d9d9d9, 
          -6px -6px 12px #ffffff;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        border: 1px solid rgba(255,255,255,0.8);
      }
      
      .icon-3d:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 
          8px 8px 16px #d9d9d9, 
          -8px -8px 16px #ffffff;
      }

      /* Primary Button */
      .clay-button-primary {
        background: #121212;
        color: #FFFFFF;
        border-radius: var(--radius-btn);
        font-weight: 700;
        padding: 16px 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        cursor: pointer;
        box-shadow: 0 4px 0 #333, 0 8px 15px rgba(0,0,0,0.2);
        border: none;
      }

      .clay-button-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0 #333, 0 15px 25px rgba(0,0,0,0.25);
      }

      .clay-button-primary:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #333, 0 4px 6px rgba(0,0,0,0.1);
      }
      
      .clay-button-primary:disabled {
        background: #999;
        box-shadow: none;
        transform: none;
        cursor: not-allowed;
      }

      /* Form Inputs */
      input, select, textarea {
        background: #FDFDFC;
        border: 1px solid #E5E5E5 !important;
        border-radius: var(--radius-md);
        color: #000000 !important;
        font-weight: 600;
        padding: 16px;
        outline: none;
        transition: all 0.2s;
        font-size: 1rem;
        width: 100%;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      }

      input:focus, select:focus, textarea:focus {
        background: #FFFFFF;
        border-color: #121212 !important;
        box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        transform: scale(1.01);
      }

      /* Glass Nav */
      .glass-nav {
        background: rgba(245, 244, 240, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255,255,255,0.5);
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
